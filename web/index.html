<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table JavaScript Sandbox</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141518;
      --panel: #202227;
      --panel-strong: #2a2d33;
      --text: #f3f0e8;
      --muted: #a9b0ba;
      --line: #3a3e46;
      --accent: #00a676;
      --warn: #f0b429;
      --error: #ff5a5f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 420px);
      gap: 16px;
      min-height: 100vh;
      padding: 16px;
    }

    .editor,
    .preview {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .toolbar,
    .statusBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .statusBar {
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 14px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #06120e;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: calc(100vh - 74px);
      resize: none;
      border: 0;
      outline: 0;
      padding: 14px;
      background: #111215;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.45;
      tab-size: 2;
    }

    .preview {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .tableWrap {
      display: grid;
      place-items: center;
      padding: 18px;
      min-height: 0;
    }

    .tableSurface {
      width: min(100%, 360px);
      aspect-ratio: 44 / 96;
      border: 1px solid var(--line);
      background: #050607;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    .status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status.ok {
      color: var(--accent);
    }

    .status.error {
      color: var(--error);
    }

    @media (max-width: 780px) {
      .app {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 420px;
      }

      .preview {
        min-height: 540px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="editor">
      <div class="toolbar">
        <h1>Table JavaScript Sandbox</h1>
        <div class="actions">
          <button id="resetButton">Reset</button>
          <button class="primary" id="runButton">Run</button>
        </div>
      </div>
      <textarea id="code" spellcheck="false">let hits = []

function setup(table) {
}

function strike(hit, table) {
  hits.push({ x: hit.x, y: hit.y, side: hit.side, age: 0 })
}

function update(dt, table) {
  for (let i = 0; i < hits.length; i += 1) {
    hits[i].age += dt
  }
  hits = hits.filter((hit) => hit.age < 2)
}

function draw(g, table) {
  g.clear("black")
  g.noStroke()

  for (let i = 0; i < hits.length; i += 1) {
    const hit = hits[i]
    const radius = 2 + hit.age * 12
    const alpha = Math.max(0, 255 - hit.age * 128)
    if (hit.side === "near") {
      g.fill([0, 80, 255, alpha])
    } else {
      g.fill([0, 255, 80, alpha])
    }
    g.circle(hit.x, hit.y, radius)
  }
}</textarea>
    </section>

    <section class="preview">
      <div class="toolbar">
        <h1>LED Matrix</h1>
        <div class="actions">
          <button id="farButton">Far</button>
          <button id="nearButton">Near</button>
        </div>
      </div>
      <div class="tableWrap">
        <div class="tableSurface">
          <canvas id="tableCanvas" width="44" height="96"></canvas>
        </div>
      </div>
      <div class="statusBar">
        <div id="status" class="status">Ready</div>
      </div>
    </section>
  </main>

  <script src="graphics.js"></script>
  <script src="simulator.js"></script>
</body>
</html>
